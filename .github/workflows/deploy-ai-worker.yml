name: Deploy VayuGuard Gemini API
on:
  push:
    branches: ["main"]
    paths:
      - "worker/src/**"
      - "worker/wrangler.toml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vayuguard-ai-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: node --check worker/src/index.js

      - name: Deploy secure Gemini proxy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets}"
          : "${GEMINI_API_KEY:?Add GEMINI_API_KEY in GitHub Actions secrets}"
          npx --yes wrangler@latest deploy 2>&1 | tee "$RUNNER_TEMP/vayuguard-worker-deploy.log"
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@latest secret put GEMINI_API_KEY

      - name: Configure the frontend Worker URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKER_BASE_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/vayuguard-worker-deploy.log" | tail -n1 || true)"
          if [[ -z "$WORKER_BASE_URL" ]]; then
            echo "Could not detect the workers.dev URL. Check the deployment output and Cloudflare Workers & Pages settings." >&2
            exit 1
          fi
          WORKER_ENDPOINT="${WORKER_BASE_URL%/}/ask"
          printf '// Auto-configured by the VayuGuard AI deployment workflow.\nwindow.VAYUGUARD_AI_ENDPOINT = "%s";\n' "$WORKER_ENDPOINT" > ai-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-config.js
          if git diff --cached --quiet; then
            echo "The frontend already points to this Worker endpoint."
          else
            git commit -m "Configure deployed VayuGuard Gemini endpoint"
            git push
          fi
          echo "## VayuGuard Gemini API" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker endpoint: $WORKER_ENDPOINT" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggering GitHub Pages deployment with the configured endpoint." >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ambkeshwargupta/SwachhVayu-AI/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
